<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="form_container">
        <div class="form_group">
            <label class="form_label">Nom:</label>
            <input type="text" id="form_nom" class="form_field"/>
        </div>
        <div class="form_group">
            <label class="form_label">Prénom:</label>
            <input type="text" id="form_prenom" class="form_field"/>
        </div>
        <div class="form_group">
            <label class="form_label">Points:</label>
            <input type="number" id="form_points" class="form_field"/>
        </div>
        <button class="btn-add" onclick="doNewData()">Ajouter</button>
    </div>
   <table class="tab-container" id="table_body">
        <tr>
            <td class="col_number">N</td>
            <td class="col_text">Nom</td>
            <td class="col_text">Prénom</td>
            <td class="col_number">Points</td>
            <td class="col_checkbox">Select</td>
        </tr>
    
    </table>
    <div id="container_summary">
        <p id="p1">0 ligne (s)</p>
        <p id="p2"></p>
        <p id="p3">Totale point (s)= 0</p>
    </div> 
    <div id="container_btn">       
         <button class="btn-extra" onclick="selectAllRows()">Tout sélectionner / Désélectionner</button>
        <button class="btn-extra" onclick="afficherMoyenne()">Calculer la moyenne</button>
        <button class="btn-extra" onclick="viderTableau()"> Vider le tableau</button>
        <button class="btn-consol" onclick="ConsoleTableau()">Console Tableau</button>
        <button class="btn-del" onclick="deleteRow()"> Supprimer</button>
       
    </div>
    <script src="script.js"></script>

</body>
</html>
